[package]
name = "nba2k27-exporter-tauri2"
version = "0.1.27"
edition = "2024"
publish = false
description = "NBA 2K27 archive explorer and exporter"

[dependencies]
nba2k-assets = { path = "shared/nba2k-assets" }
anyhow = "1"
sha2 = "0.10.9"
crc32fast = "1.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fancy-regex = "=0.19.2"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
libloading = "0.8"
half = "2"
base64 = "0.22"
include_dir = "0.7"
webview2-com = "0.39.1"
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
development = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
