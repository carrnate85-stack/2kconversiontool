[package]
name = "scoreboard-offline"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
regex = "1"
libloading = "0.8"
crc32fast = "1"
windows = { version = "0.62", features = ["Win32_Foundation","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_Memory","Win32_System_Diagnostics_Debug"] }
[lib]
path="lib.rs"
