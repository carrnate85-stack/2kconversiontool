[package]
name="ball-readonly-offline"
version="0.1.0"
edition="2024"
publish=false
[dependencies]
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
flate2="1"
windows={version="0.62",features=["Win32_Foundation","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp","Win32_System_Diagnostics_Debug","Win32_System_Memory"]}
[lib]
path="lib.rs"
[[bin]]
name="ball-v2-readonly-probe"
path="main.rs"
