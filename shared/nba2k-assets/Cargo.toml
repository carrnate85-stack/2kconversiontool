[package]
name = "nba2k-assets"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
libloading = "0.8"
base64 = "0.22"
